services:
  streamlit:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured in Coolify}
      APP_ENV: ${APP_ENV:-dev}
    expose:
      - "8501"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    networks:
      - default
      - database

networks:
  database:
    external: true
    name: samwoo-postgres-prod
