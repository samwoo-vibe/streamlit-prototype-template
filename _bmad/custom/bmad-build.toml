[workflow]

persistent_facts = [
  "신규 프로토타입은 one-shot으로 라우팅하지 않는다. 승인된 Product Brief를 입력으로 plan-code-review 경로를 사용한다.",
  "명세 checkpoint에서 사용자의 명시적 승인을 받기 전에는 구현하지 않는다.",
  "구현 중 주요 화면과 핵심 업무 흐름의 동작 가능한 초안이 준비되면 테스트 가능한 상태를 유지한 채 HALT한다. 화면 구성, 업무 흐름, 입력·출력 동작을 요약하고 사용자 피드백을 기다린 뒤 구현을 계속한다.",
  "사용자 피드백으로 승인되지 않은 제품 의도, 화면 구성 또는 업무 규칙을 임의로 확정하지 않는다.",
]

on_complete = "테스트 결과와 변경사항을 제시한 뒤 HALT하고 commit·main push·자동 배포에 대한 사용자의 명시적 승인을 요청한다. 승인 전에는 commit, push 또는 원격 작업을 하지 않는다."
