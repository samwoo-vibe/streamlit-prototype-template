[project]
name = "samwoo-streamlit-prototype"
version = "0.1.0"
description = "Samwoo citizen-development Streamlit prototype"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.46,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents", "_bmad"]

[tool.hatch.build.targets.wheel]
packages = ["src/samwoo_prototype"]
