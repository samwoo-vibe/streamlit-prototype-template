[server]
# The container has a 512 MiB memory limit. Streamlit otherwise accepts files
# and WebSocket messages up to 200 MB each, which can exhaust the container
# before application-level validation runs.
maxUploadSize = 50
maxMessageSize = 50
enableCORS = true
enableXsrfProtection = true

[client]
# The deployment is public by default. Keep exception messages and tracebacks
# in server logs instead of disclosing internals or connection details in the UI.
showErrorDetails = "none"
showErrorLinks = false
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
